name: Release

on:
    push:
        tags:
            - "v*.*.*" # 仅当推送匹配 vX.X.X 的标签时触发正式发布

# Intentionally tag-only: the release name is derived from `refs/tags/...`
# below, so a workflow_dispatch run would produce an invalid release name.
# Publishing has external side effects, so runs queue instead of being cancelled.
concurrency:
    group: tag-release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write # Required for creating releases and uploading assets
        env:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            ENABLE_NPM_PUBLISH: ${{ vars.ENABLE_NPM_PUBLISH }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc # 读取 .nvmrc 中的 Node.js 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run security regression tests
              run: npm test

            - name: Build dist and dist-min
              run: npm run build

            - name: Verify committed integration assets
              run: |
                  npm run test:example-sync
                  npm run check:examples
                  git diff --exit-code -- \
                    _examples-integrate/vue2/public/static/UEditorPlus \
                    _examples-integrate/vue3/public/static/UEditorPlus \
                    _examples-integrate/reactx/public/static/UEditorPlus
                  if [ -n "$(git ls-files --others --exclude-standard -- \
                    _examples-integrate/vue2/public/static/UEditorPlus \
                    _examples-integrate/vue3/public/static/UEditorPlus \
                    _examples-integrate/reactx/public/static/UEditorPlus)" ]; then
                    echo "Generated integration files are missing from the commit."
                    exit 1
                  fi

            - name: Verify generated security distribution
              run: npm run test:dist

            - name: Create zip archives
              run: |
                  # Create dist.zip from dist directory
                  zip -rq dist.zip dist/
                  # Create dist-min.zip from dist-min directory
                  zip -rq dist-min.zip dist-min/
                  # List created files for verification
                  ls -lh *.zip

            - name: Create GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Extract tag name
                  TAG_NAME=${GITHUB_REF#refs/tags/}
                  # Create release with zip assets attached
                  gh release create "$TAG_NAME" \
                    --title "Release $TAG_NAME" \
                    --generate-notes \
                    dist.zip \
                    dist-min.zip

            # This step is inherited from upstream and is opt-in for this fork.
            # A fork does not inherit upstream secrets, and package.json still
            # declares the upstream package name `ueditor-plus-main`. Publishing
            # without an explicit opt-in would fail AFTER the release above has
            # already been created, leaving a confusing half-finished run.
            - name: Publish to npm
              if: env.ENABLE_NPM_PUBLISH == 'true' && env.NPM_TOKEN != ''
              run: |
                  echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
                  npm publish --access public

            - name: Report skipped npm publish
              if: env.ENABLE_NPM_PUBLISH != 'true' || env.NPM_TOKEN == ''
              run: |
                  echo "npm publish skipped: publishing is opt-in for this fork."
                  echo "The GitHub Release above was created successfully."
                  echo "To publish, first rename the package in package.json, then set the NPM_TOKEN secret and the ENABLE_NPM_PUBLISH repository variable to true."
